name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          shellcheck --severity=info \
            install.sh \
            bash/bashrc \
            bash/bashrc.local.example \
            bash/bashrc.d/*.sh
