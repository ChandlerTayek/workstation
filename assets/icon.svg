<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="workstation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Rounded app-icon background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Monitor -->
  <rect x="22" y="26" width="84" height="58" rx="8" fill="#0F172A" stroke="#E2E8F0" stroke-width="4"/>
  <!-- Terminal prompt >_ -->
  <polyline points="37,45 47,54 37,63" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="53" y1="64" x2="69" y2="64" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <!-- Stand and base -->
  <rect x="58" y="84" width="12" height="11" fill="#E2E8F0"/>
  <rect x="42" y="94" width="44" height="7" rx="3.5" fill="#E2E8F0"/>
  <!-- Passing-check badge -->
  <circle cx="99" cy="84" r="14" fill="#22C55E" stroke="#FFFFFF" stroke-width="4"/>
  <polyline points="92,84 97,89 106,79" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
